<!-- Semantic conversion of the non-semantic example -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Semantic Conversion Example</title>
</head>
<body>
  <header>
    <div class="logo">My Site</div>
    <nav>
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <article>
      <h1>Welcome to My Site</h1>
      <p>This is my first paragraph...</p>
      <p>This is my second paragraph...</p>
    </article>

    <aside>
      <h2>Recent Posts</h2>
      <ul>
        <li>Post A</li>
        <li>Post B</li>
      </ul>
    </aside>
  </main>

  <footer>
    <p>© 2026</p>
  </footer>
</body>
</html>
